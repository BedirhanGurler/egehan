name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: spec contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The dictionary contract is a hard gate: a typo in a placeholder name does not crash
      # anything, it quietly ships a broken sentence into a keepsake someone intends to keep.
      - name: Validate the dictionary contract
        run: npm run spec:validate

      - name: Check that the published assets still match core-spec
        run: npm run sync-spec -w egehan -- --check

      - name: Check that the expected fixture reports still match the engine
        run: npm run fixtures:generate -w egehan -- --check

      # Only the contract's own tests here: the engine and the extension need a build, which the
      # matrix job below does across every platform this tool claims to support.
      - name: Test the contract
        run: npm test -w @egehan/core-spec

  node:
    name: cli + extension (${{ matrix.os }}, node ${{ matrix.node }})
    # Turkish characters in git log output are exactly the kind of thing that works on macOS and
    # breaks on Windows, so the matrix is not optional here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the engine reads history; a shallow clone would hide bugs

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck

      # git must be configured for the integration tests, which build real repositories.
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - run: npm test

  dotnet:
    name: dotnet engine (${{ matrix.tfm }})
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The conformance suite is the point of this job: it runs the .NET engine over the same
      # fixtures the Node engine produced its expected reports from, and fails on any difference.
      - name: Test the engine against the shared fixtures
        run: dotnet test packages/dotnet-tool/Egehan.sln -f ${{ matrix.tfm }} --nologo

      # Packing is part of the contract too: the tool must carry both frameworks, so that a
      # machine with only the .NET 8 runtime installs the net8.0 asset and a newer one does not.
      - name: Pack the global tool
        if: matrix.tfm == 'net10.0'
        run: dotnet pack packages/dotnet-tool/Egehan.Cli/Egehan.Cli.csproj -c Release --nologo
